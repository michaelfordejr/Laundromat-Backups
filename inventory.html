<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Laundromat Fleet Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="portal.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-100 min-h-screen flex" x-data="inventoryApp()" x-init="init()">

    <!-- Sidebar -->
    <aside class="w-64 bg-black text-gray-300 flex flex-col fixed h-full z-40">
        <div class="p-6 border-b border-gray-800">
            <h1 class="text-xl font-bold">Fleet Pro</h1>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="index.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Dashboard
            </a>
            <a href="sites.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                Sites
            </a>
            <a href="inventory.html" class="flex items-center p-3 rounded-lg bg-blue-600 text-white">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                Inventory
            </a>
            <a href="analytics.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 01-2 2h22a2 2 0 01-2-2v-10a2 2 0 00-2-2h-2a2 2 0 00-2 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                Analytics
            </a>
            <a href="team.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                Team Hub
            </a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <button @click="logout()" class="w-full bg-red-900 hover:bg-red-800 p-2 rounded text-sm transition">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 p-8">
        <div class="max-w-6xl mx-auto">
            <header class="flex justify-between items-center mb-10">
                <div>
                    <h2 class="text-3xl font-black text-gray-900">Spare Parts Inventory</h2>
                    <p class="text-gray-500">Track and manage your maintenance stock</p>
                </div>
                <div class="flex space-x-3">
                    <button @click="generatePO()" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-xl font-bold hover:bg-blue-100 transition">Order Parts</button>
                    <button @click="saveData()" :disabled="!isDirty" :class="isDirty ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-400'" class="px-6 py-2 rounded-xl font-bold shadow transition">
                        Sync Changes
                    </button>
                </div>
            </header>

            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="p-6 text-xs font-bold text-gray-400 uppercase">Part Details</th>
                            <th class="p-6 text-xs font-bold text-gray-400 uppercase text-center">In Stock</th>
                            <th class="p-6 text-xs font-bold text-gray-400 uppercase">Status</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">
                        <template x-for="part in data.spareParts" :key="part.id">
                            <tr class="hover:bg-gray-50 transition">
                                <td class="p-6">
                                    <p class="font-black text-gray-900" x-text="part.name"></p>
                                    <p class="text-gray-400 font-mono text-[10px]" x-text="'#' + part.partNumber"></p>
                                </td>
                                <td class="p-6">
                                    <div class="flex items-center justify-center space-x-4">
                                        <button @click="updateStock(part, -1)" class="w-8 h-8 rounded-full border-2 flex items-center justify-center hover:bg-gray-100">-</button>
                                        <span class="text-lg font-black w-10 text-center" x-text="part.stockQuantity"></span>
                                        <button @click="updateStock(part, 1)" class="w-8 h-8 rounded-full border-2 flex items-center justify-center hover:bg-gray-100">+</button>
                                    </div>
                                </td>
                                <td class="p-6">
                                    <template x-if="part.stockQuantity <= part.minimumThreshold">
                                        <span class="bg-red-600 text-white px-3 py-1 rounded-lg text-[10px] font-black uppercase">Restock</span>
                                    </template>
                                    <template x-if="part.stockQuantity > part.minimumThreshold">
                                        <span class="bg-green-100 text-green-700 px-3 py-1 rounded-lg text-[10px] font-black uppercase">Available</span>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function inventoryApp() {
            const shared = getPortalApp();
            return {
                ...shared,
                async init() {
                    await this.initShared();
                },
                updateStock(part, delta) {
                    part.stockQuantity = Math.max(0, part.stockQuantity + delta);
                    this.isDirty = true;
                },
                generatePO() {
                    const low = this.data.spareParts.filter(p => p.stockQuantity <= p.minimumThreshold);
                    if (!low.length) return alert('Stock levels healthy.');
                    const list = low.map(p => `- ${p.name} (#${p.partNumber})`).join('\n');
                    alert('Required Parts:\n\n' + list);
                }
            }
        }
    </script>
</body>
</html>
