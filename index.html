<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Laundromat Fleet Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="portal.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-100 min-h-screen flex" x-data="getPortalApp()" x-init="initShared()">

    <!-- Sidebar -->
    <aside x-show="token" x-cloak class="w-64 bg-black text-gray-300 flex flex-col fixed h-full z-40">
        <div class="p-6 border-b border-gray-800">
            <h1 class="text-xl font-bold flex items-center">
                <span class="text-blue-500 mr-2">N|M</span> Fleet Pro
            </h1>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="index.html" class="flex items-center p-3 rounded-lg bg-blue-600 text-white">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Dashboard
            </a>
            <a href="sites.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                Sites
            </a>
            <a href="inventory.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                Inventory
            </a>
            <a href="analytics.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 01-2 2h22a2 2 0 01-2-2v-10a2 2 0 00-2-2h-2a2 2 0 00-2 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                Analytics
            </a>
            <a href="team.html" class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                Team Hub
            </a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <button @click="logout()" class="w-full bg-red-900 hover:bg-red-800 p-2 rounded text-sm transition">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 p-8" :class="!token ? 'ml-0' : ''">

        <!-- Auth View -->
        <div x-show="!token" x-cloak class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl mt-24">
            <div class="text-center mb-8">
                <h2 class="text-4xl font-black mb-2"><span class="text-blue-600">N|M</span> Fleet</h2>
                <p class="text-gray-500 uppercase tracking-widest text-xs font-bold">Portal Access</p>
            </div>
            <div class="space-y-4">
                <input type="password" x-model="tempToken" placeholder="GitHub Access Token" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl focus:border-blue-500 outline-none transition">
                <button @click="login()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-black shadow-lg hover:bg-blue-700 transition">Connect to Fleet</button>
            </div>
        </div>

        <!-- Dashboard Content -->
        <div x-show="token" x-cloak class="max-w-6xl mx-auto">
            <header class="flex justify-between items-center mb-10">
                <div>
                    <h2 class="text-3xl font-black text-gray-900">Dashboard</h2>
                    <p class="text-gray-500">Fleet Management Console</p>
                </div>
                <button @click="fetchData()" class="bg-white border-2 p-3 rounded-xl hover:bg-gray-50 transition shadow-sm">
                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" :class="loading ? 'animate-spin' : ''"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Total Fleet</p>
                    <p class="text-3xl font-black" x-text="data.machines.length"></p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-xs font-bold text-red-400 uppercase tracking-widest">Active Faults</p>
                    <p class="text-3xl font-black text-red-600" x-text="data.machines.filter(m => m.status === 'DOWN').length"></p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-xs font-bold text-orange-400 uppercase tracking-widest">Maintenance</p>
                    <p class="text-3xl font-black text-orange-600" x-text="data.machines.filter(m => m.status === 'SERVICE_REQUIRED').length"></p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <p class="text-xs font-bold text-green-400 uppercase tracking-widest">Operational</p>
                    <p class="text-3xl font-black text-green-600" x-text="data.machines.filter(m => m.status === 'OPERATIONAL').length"></p>
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 border-b bg-gray-50">
                    <h3 class="font-black text-gray-800 uppercase tracking-wider text-xs">Recent Service Logs</h3>
                </div>
                <div class="divide-y max-h-[500px] overflow-y-auto">
                    <template x-for="log in data.logs.slice().reverse().slice(0, 15)" :key="log.id">
                        <div class="p-4 hover:bg-gray-50 flex items-center">
                            <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 mr-4">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                            </div>
                            <div class="flex-1">
                                <p class="text-sm font-black text-gray-900" x-text="log.action"></p>
                                <p class="text-xs text-gray-400 font-medium" x-text="getMachineName(log.machineId)"></p>
                            </div>
                            <div class="text-right">
                                <span class="text-xs font-bold text-gray-300" x-text="formatDate(log.timestamp)"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
